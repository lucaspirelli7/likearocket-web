name: Build & push image

# Construye la imagen Docker FUERA del VPS (runner de GitHub) y la publica en GHCR.
# Coolify solo descarga la imagen ya hecha (nginx + HTML estático, ~50 MB), sin gastar
# RAM/CPU del servidor en compilar.

on:
  push:
    branches: [codex/astro-brand-refresh]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=astro-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PUBLIC_* de Astro: se definen como "Variables" del repo (Settings > Secrets and variables > Actions).
          build-args: |
            PUBLIC_FORM_ENDPOINT=${{ vars.PUBLIC_FORM_ENDPOINT }}
            PUBLIC_BOOKING_URL=${{ vars.PUBLIC_BOOKING_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opcional: avisa a Coolify para que descargue la nueva imagen y redespliegue.
      # Requiere el secret COOLIFY_DEPLOY_WEBHOOK (URL completa del webhook de deploy de la
      # aplicación en Coolify). Si no está, se omite este paso.
      - name: Redeploy en Coolify
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsSL --retry 3 -X POST "$HOOK"
          else
            echo "COOLIFY_DEPLOY_WEBHOOK no configurado — se omite el redeploy automático."
          fi
