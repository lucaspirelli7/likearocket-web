server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Detrás del proxy de Coolify: que las redirecciones no lleven el puerto interno.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Redirecciones 301 del brief (§5): ninguna URL antigua puede quedar en 404.
  # Las mismas que public/_redirects y astro.config.mjs.
  rewrite ^/que-ofrecemos/?$ /seo-local-geo permanent;
  rewrite ^/planes/?$        /              permanent;
  rewrite ^/about-us/?$      /sobre-nosotros permanent;
  rewrite ^/appointment/?$   /cita          permanent;

  # Assets con hash de Astro: caché de un año. `^~` para que gane a la regla de extensiones.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?|ttf)$ {
    expires 30d;
    try_files $uri =404;
  }

  # HTML: revalidar siempre. /ruta y /ruta/ sirven /ruta/index.html sin redirección.
  location / {
    expires -1;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
